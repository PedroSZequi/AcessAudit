spring.application.name=accessaudit-backend
server.port=8080

# ========== Datasource (Postgres local) ==========
spring.datasource.url=jdbc:postgresql://localhost:5432/accessaudit
spring.datasource.username=mihaelrbx
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA / Hibernate ==========
# Schema gerenciado pelo Flyway; Hibernate apenas valida que as entidades batem
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ========== Flyway (migrations a partir de B2) ==========
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ========== Springdoc / Swagger UI (cobre TG3.6) ==========
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ========== Actuator (health para ALB AWS — RNF06) ==========
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ========== AccessAudit ==========
# Timeout do JsoupColetor (RNF02: SLA 5s total, deixa folga de 1s para o resto)
accessaudit.coletor.timeoutMs=4000

# Origens permitidas para CORS (frontend Vite roda em :5173)
accessaudit.cors.allowedOrigins=http://localhost:5173,http://127.0.0.1:5173

# ========== Logging (RNF08) ==========
logging.level.com.accessaudit=DEBUG
logging.level.org.springframework.web=INFO
