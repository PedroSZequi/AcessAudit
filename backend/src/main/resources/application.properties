spring.application.name=accessaudit-backend
server.port=8080

# ========== Datasource (Postgres local em dev; em container, sobrescrito por env vars) ==========
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/accessaudit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mihaelrbx}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA / Hibernate ==========
# Schema gerenciado pelo Flyway; Hibernate apenas valida que as entidades batem
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ========== Flyway (migrations a partir de B2) ==========
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ========== Springdoc / Swagger UI (cobre TG3.6) ==========
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ========== Actuator (health + probes para ALB/K8s — RNF06) ==========
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
# Probes específicos: /actuator/health/liveness e /actuator/health/readiness
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Banner de info na home do actuator
management.info.env.enabled=true
info.app.name=AccessAudit
info.app.description=Sistema de auditoria de acessibilidade digital

# ========== AccessAudit ==========
# Timeout do JsoupColetor (RNF02: SLA 5s total, deixa folga de 1s para o resto)
accessaudit.coletor.timeoutMs=4000

# Origens permitidas para CORS (frontend Vite roda em :5173). Em produção
# o Nginx faz reverse proxy e a chamada é same-origin (env var vai vazia).
accessaudit.cors.allowedOrigins=${ACCESSAUDIT_CORS_ALLOWEDORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ========== Logging (RNF08) ==========
logging.level.com.accessaudit=DEBUG
logging.level.org.springframework.web=INFO

# ========== Não vazar stack trace nem detalhes em erros HTTP ==========
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
