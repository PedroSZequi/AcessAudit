# Configuração do Nginx que serve o bundle estático do Vite
# e faz reverse proxy de /api/* e /actuator/* para o backend.

upstream accessaudit_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão básica
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache agressivo dos assets versionados gerados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida volta pro index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → backend (mesmo origin, sem CORS)
    location /api/ {
        proxy_pass         http://accessaudit_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health do backend (útil para o ALB da AWS apontar para o frontend)
    location /actuator/ {
        proxy_pass         http://accessaudit_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }
}
